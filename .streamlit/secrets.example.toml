# Streamlit Community Cloud -> App settings -> Secrets.
# Replace placeholders; do not commit real credentials.
# Keep these database values ABOVE all [sections].
DATABASE_URL = "<pooled URL from .env.local>"
DATABASE_URL_UNPOOLED = "<direct URL from .env.local>"

[deployment]
# Stop if cloud credentials are missing rather than using a temporary SQLite file.
require_cloud_database = true

[accounts]
# Copy your existing account/password-hash lines from local secrets.toml.
# laura = "<existing password hash>"

# Picture uploads are temporarily disabled in the app. No Microsoft setup is needed.
# Optional for displaying existing OneDrive pictures after IT setup:
# [onedrive]
# tenant_id = "YOUR_DIRECTORY_TENANT_ID"
# client_id = "YOUR_APPLICATION_CLIENT_ID"
# client_secret = "YOUR_CLIENT_SECRET_VALUE"
# drive_id = "YOUR_ONEDRIVE_DRIVE_ID"
# folder_id = "YOUR_REVIEW_PICTURES_FOLDER_ID"
